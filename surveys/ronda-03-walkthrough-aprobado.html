<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cid Clean, ronda 3 aprobada</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Aprobado por el dueño (2026-10-20), rondas 1 a 3.
   Ronda 3: iconos de línea fina (trazo 1.5px, sin relleno); densidad estándar (texto 15px, filas 48px, relleno de campos 10px);
   captura de áreas con formulario rápido en pantalla; selector de días con botones de nombre corto; fotos en carrusel con nota por foto.
   Las formas de los iconos son las de la muestra; la librería de iconos no se ha elegido. */
:root{--b:#0F766E;--r:12px;--bg:#FFFFFF;--sf:#F4F4F4;--fg:#1A1A1A;--bd:#E2E2E2;--sc:#6B6B6B;--ok:#3F8F5F;--wn:#B7791F;--er:#C0504D;--fs:15px;--rh:48px;--pd:10px}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--sf:#1C1C1C;--fg:#F2F2F2;--bd:#333333;--sc:#A0A0A0}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Manrope',system-ui,sans-serif;font-size:var(--fs)}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding:16px}
.app{border:0.5px solid var(--bd);border-radius:16px;overflow:hidden;background:var(--bg)}
.top{background:var(--b);color:#fff;padding:14px 16px;font-weight:500;font-size:16px}
.body{padding:16px}
h1{font-size:18px;font-weight:500;margin:0 0 12px}
.f{margin-bottom:8px}
.f label{display:block;font-size:12px;color:var(--sc);margin-bottom:3px}
.f div{border:1px solid color-mix(in srgb,var(--fg) 32%,transparent);border-radius:var(--r);padding:var(--pd) 12px}
.seg{display:flex;border:1px solid color-mix(in srgb,var(--fg) 32%,transparent);border-radius:var(--r);overflow:hidden;margin:4px 0 12px}
.seg span{flex:1;text-align:center;padding:var(--pd) 0}
.seg .on{background:var(--b);color:#fff;font-weight:500}
.row{display:flex;gap:8px}
.btn,.btn2{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);min-height:40px;font-weight:500;font-size:14px;flex:1}
.btn{background:var(--b);color:#fff}
.btn2{border:1px solid var(--b);color:var(--fg)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;font-size:12px}
.days span{text-align:center;padding:var(--pd) 0;border-radius:8px;border:1px solid color-mix(in srgb,var(--fg) 32%,transparent);color:var(--sc)}
.days span.on{background:var(--b);border-color:var(--b);color:#fff;font-weight:500}
.hint{font-size:13px;color:var(--sc);margin-top:10px}
.car{display:flex;gap:10px;overflow:hidden}
.car div{flex:none;display:flex;flex-direction:column;gap:4px}
.th{display:flex;align-items:center;justify-content:center;width:96px;height:96px;border-radius:8px;background:var(--sf);color:var(--sc)}
.car small{font-size:12px;color:var(--sc)}
svg{flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;justify-content:space-around;border-top:0.5px solid var(--bd);background:var(--sf);padding:10px 0;color:var(--sc)}
.nav .on{color:var(--b)}
</style>
</head>
<body>
<div class="wrap">

<div class="app">
<div class="top">Nueva área</div>
<div class="body">
<div class="f"><label>Tipo</label><div>Baño</div></div>
<div class="f"><label>Nombre</label><div>Baño 03</div></div>
<div class="f"><label>Tamaño</label><div>120 ft²</div></div>
<div class="seg"><span>Buena</span><span class="on">Regular</span><span>Mala</span></div>
<div class="row">
<div class="btn2"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Foto</div>
<div class="btn">Guardar y otra</div>
</div>
</div>
</div>

<div class="app">
<div class="top">Frecuencia</div>
<div class="body">
<h1>Días del servicio</h1>
<div class="days"><span class="on">Lun</span><span>Mar</span><span class="on">Mié</span><span>Jue</span><span class="on">Vie</span><span>Sáb</span><span>Dom</span></div>
<div class="hint">Lunes, miércoles y viernes: 3 veces por semana</div>
</div>
</div>

<div class="app">
<div class="top">Baño 01</div>
<div class="body">
<h1>Fotos de Baño 01</h1>
<div class="car">
<div><span class="th"><svg width="37" height="37" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></span><small>Piso con manchas</small></div>
<div><span class="th"><svg width="37" height="37" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></span><small>Espejo roto</small></div>
<div><span class="th"><svg width="37" height="37" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></span><small>Lavamanos</small></div>
</div>
<div class="row" style="margin-top:12px"><div class="btn2"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Tomar foto</div></div>
</div>
<div class="nav">
<svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10"/></svg>
<svg width="22" height="22" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
<svg class="on" width="22" height="22" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
<svg width="22" height="22" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
</div>
</div>

</div>
</body>
</html>
