<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ronda 18: hitos 4 y 5</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#FFFFFF;--fg:#1A1A1A;--sc:#6B6B6B;--sf:#F4F4F4;--bd:#E2E2E2;--b:#0F766E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#F2F2F2;--sc:#A0A0A0;--sf:#1C1C1C;--bd:#333333;--b:#2DD4BF}}
:root[data-theme="dark"]{--bg:#121212;--fg:#F2F2F2;--sc:#A0A0A0;--sf:#1C1C1C;--bd:#333333;--b:#2DD4BF}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}h1{font-size:20px;font-weight:500;margin:0 0 6px}h2{font-size:16px;font-weight:500;margin:26px 0 8px;color:var(--b)}
.i{font-size:14px;color:var(--sc);line-height:1.45}.q{margin:14px 0 6px;font-size:14px;font-weight:500;line-height:1.4}
label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:6px;font-size:14px;line-height:1.4;cursor:pointer;background:var(--sf)}
label input{margin-top:2px;accent-color:var(--b)}.r{font-size:12px;color:var(--b);white-space:nowrap}
button{width:100%;min-height:44px;border:0;border-radius:12px;background:var(--b);color:#fff;font:500 15px Manrope,system-ui,sans-serif;margin-top:20px;cursor:pointer}
textarea{width:100%;box-sizing:border-box;min-height:160px;margin-top:12px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--fg);padding:10px;font:13px Manrope,system-ui,sans-serif}</style></head>
<body><div class="w"><h1>Ronda 18: hitos 4 y 5</h1>
<p class="i">Todo lo que falta decidir para el quote, el portal del cliente, Clientes, Jobsites y Pagos, en una sola ronda. Cada pregunta ya trae marcada mi recomendación; cambia solo lo que no te guste. Al final genera el texto y pégalo en el chat.</p>
<div id="s"></div><button id="go">Generar texto con mis elecciones</button><textarea id="t" readonly hidden></textarea><button id="cp" hidden>Copiar texto</button></div>
<script>
const Q=[
["Forma de trabajo","pantallas","Pantallas nuevas sin muestra (portal: pedir código, enlace vencido, versión reemplazada, ya decidido, bloqueo y confirmación; armado y detalle del quote; PDF del quote; pantalla del Cliente; pestañas del jobsite; pestaña Pagos; alta de clientes previos):",["Las diseño con el sistema ya aprobado y las revisas en el teléfono; si algo no te gusta lo cambio","Ronda visual con opciones para cada una antes de construir"],0],
["Hito 4: quote y portal","subdominio","Dirección del portal del cliente:",["quote.cidclean.com","portal.cidclean.com","clientes.cidclean.com"],0],
["Hito 4: quote y portal","remitente","Remitente del correo del quote:",["quotes@mail.cidclean.com (dominio nuevo de envío), con respuesta a tu correo","no-reply@auth.cidclean.com (el del código)","Tu buzón de Zoho"],0],
["Hito 4: quote y portal","correo","Contenido del correo del quote:",["Enlace con sitio y vigencia, sin monto y sin adjunto","Solo el enlace","Enlace más el PDF adjunto"],0],
["Hito 4: quote y portal","idioma","Idioma del portal y del correo:",["Correo bilingüe; portal en inglés con selector EN/ES","Todo bilingüe","Según un idioma guardado en el lead"],0],
["Hito 4: quote y portal","destinatarios","A quién se envía el quote:",["Al contacto del sitio más correos opcionales; el código solo llega a esa lista","Solo al contacto del sitio"],0],
["Hito 4: quote y portal","teclado","Código del portal:",["Teclado del teléfono, como el staff (D-163)","Teclado propio de la app (D-040)"],0],
["Hito 4: quote y portal","bloqueo","Tras 5 intentos fallidos del código:",["Bloqueado hasta pedir un código nuevo (máximo 5 códigos por hora)","Bloqueado 15 minutos","Bloqueado 1 hora"],0],
["Hito 4: quote y portal","terminosportal","Términos del portal del cliente (aún sin texto del abogado):",["Mismo mecanismo que los del staff (PDF en Ajustes); mientras no haya, la casilla menciona solo el SOW","Sin términos hasta tener el texto"],0],
["Hito 4: quote y portal","pdf","PDF del quote:",["Una página: sitio, servicios, add-ons, descuentos, tax, total mensual, vigencia, versión y frecuencia; se genera al enviar y queda guardado con la versión","Lo mismo más un bloque de firma"],0],
["Hito 4: quote y portal","servicios","Renglones del quote:",["Texto libre con sugerencias de lo usado antes","Catálogo de servicios en Ajustes"],0],
["Hito 4: quote y portal","descuentos","Descuentos:",["Monto o porcentaje, restados antes del tax","Solo monto"],0],
["Hito 4: quote y portal","estados","Estados del quote:",["Borrador, Enviado, Visto, Aceptado, Rechazado, Cambios pedidos, Expirado y Reemplazado","Los mismos sin Visto"],0],
["Hito 4: quote y portal","negociar","Cuando el cliente pide cambios (Negociar):",["El portal queda en solo lectura con \"Recibimos tu solicitud\"; el lead pasa a Negociación y se avisa a quien envió","El enlace sigue activo hasta la nueva versión"],0],
["Hito 4: quote y portal","version","Una versión nueva (1.1, 1.2...):",["Reemplaza a la anterior y se reenvía sola a los mismos destinatarios","Conviven las dos"],0],
["Hito 4: quote y portal","rechazo","Rechazo de un sitio cuando el lead tiene varios:",["El lead pasa a Perdido solo cuando no queda ningún sitio abierto","El lead pasa a Perdido al primer rechazo"],0],
["Hito 4: quote y portal","vencido","Quote vencido:",["Renovar crea una versión nueva con vigencia nueva","Reabrir la misma versión"],0],
["Hito 4: quote y portal","sow","SOW:",["Un PDF obligatorio por versión del quote; se copia al jobsite al aceptar","Ligado al sitio, versionado aparte y opcional"],0],
["Hito 4: quote y portal","contrato","Contrato:",["Se sube en el jobsite después de aceptar; el portal no lo muestra","También adjunto en el portal"],0],
["Hito 4: quote y portal","permisossow","Permisos de SOW y contrato:",["Ventas (subir y ver SOW y contratos) en el lead y el quote; Clientes (editar walkthrough y SOW) en el jobsite","Uno solo para todo"],0],
["Hito 4: quote y portal","cliente","Cuando el cliente acepta:",["Nace un Cliente por lead; los demás sitios aceptados del mismo lead cuelgan de ese cliente","Un Cliente por sitio"],0],
["Hito 4: quote y portal","contacto","Contacto principal del jobsite:",["El del walkthrough; quien aceptó (nombre y cargo) queda registrado en la aceptación","Quien aceptó"],0],
["Hito 4: quote y portal","aviso","Aviso interno al aceptar, rechazar o negociar (las notificaciones completas son del hito 7):",["Correo a quien envió y pendiente en el Inicio","Solo pendiente en el Inicio"],0],
["Hito 5: clientes y jobsites","previos","Clientes que ya tienes hoy (antes de la app):",["Alta manual de Cliente y Jobsite con tarifa, frecuencia, contactos y documentos, marcado \"Previo a la app\"","Importar un archivo CSV"],0],
["Hito 5: clientes y jobsites","pantallacliente","Pantalla del Cliente (la empresa):",["Pantalla simple con datos de la empresa y sus jobsites","Sin pantalla: se edita el encabezado del grupo en la lista"],0],
["Hito 5: clientes y jobsites","walkedit","Editar el walkthrough de un jobsite:",["Se edita y guarda una versión nueva con quién y cuándo","Hay que rehacer el walkthrough"],0],
["Hito 5: clientes y jobsites","tarifa","Cambiar la tarifa al cliente:",["Con un quote nuevo; edición directa solo en clientes previos a la app, con historial","Edición directa con permiso para todos"],0],
["Hito 5: clientes y jobsites","pausado","Jobsite Pausado o Terminado:",["Detiene visitas e ingresos esperados; el personal se conserva al pausar y se cierra al terminar","Solo marca el estado"],0],
["Hito 5: clientes y jobsites","emergencia","Contacto de emergencia del jobsite:",["Nombre y teléfono","Nombre, teléfono, relación y correo"],0],
["Hito 5: clientes y jobsites","docsjobsite","Documentos del jobsite:",["El contrato exige ver tarifa y registra cada apertura; el SOW se ve con ver clientes","Ambos con ver tarifa y registro"],0],
["Hito 5: clientes y jobsites","dondepago","Dónde se asigna el pago de un empleado en un jobsite:",["En los dos lugares (Pagos del empleado y Personal del jobsite), mismo formulario","Solo en Pagos del empleado"],0],
["Hito 5: clientes y jobsites","registropagos","Abrir pagos y tarifas (D-125):",["Se registra en el historial cada apertura con cifras visibles","Solo se registran los cambios"],0],
["Hito 5: clientes y jobsites","cambiotarifa","Cambio de pago de un empleado:",["Con fecha de inicio, sin efecto retroactivo","Retroactivo"],0],
["Hito 5: clientes y jobsites","prorrateo","Tarifa fija por semana o mes que empieza a mitad de periodo:",["Prorrateo por días","Se paga el periodo completo"],0],
["Hito 5: clientes y jobsites","minimo","Salario mínimo $15:",["Solo para W-2 pagados por hora (como dice el flujo)","También para W-2 con tarifa fija, convertida a hora"],0],
["Hito 5: clientes y jobsites","margen","Alerta de margen antes de tener el Schedule:",["Con las horas estimadas del walkthrough por frecuencia; luego la reemplaza el Schedule","No alertar hasta el hito 6"],0],
["Hito 5: clientes y jobsites","quitarempleado","Quitar a un empleado de un jobsite:",["Con fecha de fin, conservando el historial","Borrar la asignación"],0],
["Hito 5: clientes y jobsites","nombrejobsite","Nombre del jobsite:",["El nombre del sitio del lead, editable","La dirección"],0],
["Hito 5: clientes y jobsites","mapa","Ubicación del jobsite para el GPS del clock in:",["La dirección se ubica sola y confirmas el punto en el mapa (servicio de mapas de bajo costo; te digo el costo antes de activarlo)","Marcas el punto en el mapa a mano"],0],
["Hito 5: clientes y jobsites","supervisor","Supervisor y pagos:",["Puede asignar personal sin ver cifras; el pago lo pone quien tiene Asignar pago","Solo quien tiene Asignar pago asigna personal"],0]
];
const s=document.getElementById('s');let g='';
Q.forEach((q,k)=>{if(q[0]!==g){g=q[0];const h=document.createElement('h2');h.textContent=g;s.appendChild(h);}
const p=document.createElement('p');p.className='q';p.textContent=(k+1)+'. '+q[2];s.appendChild(p);
q[3].forEach((o,i)=>{const l=document.createElement('label');l.innerHTML='<input type="radio" name="'+q[1]+'" value="'+i+'"'+(i===q[4]?' checked':'')+'><span style="flex:1"></span>'+(i===q[4]?'<span class="r">Recomendado</span>':'');l.querySelector('span').textContent=o;s.appendChild(l);});});
document.getElementById('go').onclick=()=>{const ch=[];Q.forEach((q,k)=>{const v=+document.querySelector('input[name="'+q[1]+'"]:checked').value;if(v!==q[4])ch.push((k+1)+'. '+q[2]+' '+q[3][v]);});
const t=document.getElementById('t');t.value='Ronda 18: acepto todas las recomendaciones'+(ch.length?' salvo estas: '+ch.join(' | '):'.');t.hidden=false;document.getElementById('cp').hidden=false;t.select();};
document.getElementById('cp').onclick=()=>{const t=document.getElementById('t');t.select();try{document.execCommand('copy')}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(t.value).catch(()=>{});};
</script></body></html>
