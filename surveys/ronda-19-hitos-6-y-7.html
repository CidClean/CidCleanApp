<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ronda 19: hitos 6 y 7</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#FFFFFF;--fg:#1A1A1A;--sc:#6B6B6B;--sf:#F4F4F4;--bd:#E2E2E2;--b:#0F766E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#F2F2F2;--sc:#A0A0A0;--sf:#1C1C1C;--bd:#333333;--b:#2DD4BF}}
:root[data-theme="dark"]{--bg:#121212;--fg:#F2F2F2;--sc:#A0A0A0;--sf:#1C1C1C;--bd:#333333;--b:#2DD4BF}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Manrope,system-ui,sans-serif}
.w{max-width:640px;margin:0 auto;padding:16px}h1{font-size:20px;font-weight:500;margin:0 0 6px}h2{font-size:16px;font-weight:500;margin:26px 0 8px;color:var(--b)}
.i{font-size:14px;color:var(--sc);line-height:1.45}.q{margin:14px 0 6px;font-size:14px;font-weight:500;line-height:1.4}
label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;margin-bottom:6px;font-size:14px;line-height:1.4;cursor:pointer;background:var(--sf)}
label input{margin-top:2px;accent-color:var(--b)}.r{font-size:12px;color:var(--b);white-space:nowrap}
button{width:100%;min-height:44px;border:0;border-radius:12px;background:var(--b);color:#fff;font:500 15px Manrope,system-ui,sans-serif;margin-top:20px;cursor:pointer}
textarea{width:100%;box-sizing:border-box;min-height:160px;margin-top:12px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);color:var(--fg);padding:10px;font:13px Manrope,system-ui,sans-serif}</style></head>
<body><div class="w"><h1>Ronda 19: hitos 6 y 7</h1>
<p class="i">Todo lo que falta decidir para el Schedule, el clock in con GPS, la aprobación del trabajo, Accounting y las notificaciones, en una sola ronda. Cada pregunta ya trae marcada mi recomendación; cambia solo lo que no te guste. Al final genera el texto y pégalo en el chat.</p>
<div id="s"></div><button id="go">Generar texto con mis elecciones</button><textarea id="t" readonly hidden></textarea><button id="cp" hidden>Copiar texto</button></div>
<script>
const Q=[["Hito 6: clock in y GPS", "radio", "Radio de la geocerca alrededor del Plus Code del jobsite:", ["150 m", "100 m", "250 m"], 0], ["Hito 6: clock in y GPS", "sinpermiso", "El teléfono no da permiso de ubicación o no tiene señal GPS al marcar entrada:", ["Deja marcar y la entrada queda \"Sin ubicación\" para que la revise el admin", "No deja marcar hasta dar el permiso", "Deja marcar solo si un supervisor lo confirma"], 0], ["Hito 6: clock in y GPS", "salida", "GPS al marcar salida:", ["Guarda la ubicación sin validarla", "No guarda ubicación", "Se valida igual que la entrada"], 0], ["Hito 6: clock in y GPS", "offline", "Marcar entrada o salida sin internet:", ["Se guarda con la hora del teléfono, se sincroniza después y queda marcada para revisión", "Se exige conexión", "Solo la salida se guarda sin conexión"], 0], ["Hito 6: clock in y GPS", "antes", "Cuánto antes de la hora programada se puede marcar entrada:", ["30 minutos", "15 minutos", "Cualquier hora del mismo día"], 0], ["Hito 6: olvidos", "olvidosalida", "Olvido de marcar salida:", ["Se cierra sola a la hora de fin programada, marcada para revisión, y se avisa", "Solo se avisa 30 min después y el admin la corrige al aprobar", "El turno queda abierto hasta que lo cierre un supervisor"], 0], ["Hito 6: olvidos", "olvidoentrada", "Aviso de \"clock in olvidado\":", ["A los 30 minutos de la hora de inicio", "A los 15 minutos", "Al final del día"], 0], ["Hito 6: horario", "horavisita", "Hora y duración de cada visita:", ["Se definen en el jobsite y se pueden cambiar por visita", "Solo por visita", "Por empleado asignado"], 0], ["Hito 6: horario", "otra", "Frecuencia \"Otra\" (texto libre):", ["El admin programa esas visitas a mano", "Se reemplaza por patrones (días del mes, cada 2 semanas)"], 0], ["Hito 6: horario", "generar", "Hasta cuándo se generan visitas por adelantado:", ["4 semanas, renovándose solas", "2 semanas", "8 semanas"], 0], ["Hito 6: horario", "vistaadmin", "Pantalla del admin para editar el schedule:", ["Lista por día con todos los jobsites y sus empleados", "Semana por jobsite", "Semana por empleado"], 0], ["Hito 6: horario", "confirmar", "\"Empleado sin confirmar\":", ["El empleado confirma cada visita con un botón y se avisa al admin si no confirmó 24 h antes", "No hay confirmación (se quita ese aviso)"], 1], ["Hito 6: horas y pago", "alerta32", "Alerta de 32 h semanales (lunes a domingo, todos los jobsites):", ["Aviso desde 28 h y bloqueo al programar más de 32 h", "Solo aviso desde 28 h", "Aviso desde 30 h y bloqueo a 32 h"], 0], ["Hito 6: horas y pago", "garantizadas", "Horas garantizadas:", ["Por visita", "Por semana"], 0], ["Hito 6: horas y pago", "redondeo", "Redondeo de las horas trabajadas:", ["Al minuto", "A 15 minutos", "A 5 minutos"], 0], ["Hito 6: horas y pago", "gpsaprobar", "Aprobar un trabajo con GPS fuera de rango:", ["Primero alguien con Revisar alertas de GPS lo marca revisado, después se aprueba", "Aprobar resuelve todo"], 0], ["Hito 6: horas y pago", "noprogramado", "Quien no estaba programado pero trabajó:", ["Solo un supervisor o admin lo agrega", "El empleado también puede marcar entrada y queda para revisión"], 0], ["Hito 7: Accounting", "ingreso", "Ingreso esperado del mes:", ["Se genera el día 1; el primer mes se prorratea por días", "Se genera el día de inicio del contrato, mensual completo", "Se genera el día 1 sin prorrateo"], 0], ["Hito 7: Accounting", "profit", "Profit del dashboard:", ["Sobre lo esperado del mes, con la línea Recibido / Pendiente", "Sobre lo recibido"], 0], ["Hito 7: Accounting", "recurrentes", "Gastos recurrentes:", ["Mensuales y anuales", "Solo mensuales", "Mensuales, anuales y semanales"], 0], ["Hito 7: Accounting", "periodopago", "Cada cuánto pagas a tu personal (para calcular lo que se debe):", ["Semanal", "Quincenal (cada 2 semanas)", "Dos veces al mes (1 y 15)", "Mensual"], 0], ["Hito 7: Accounting", "reportes", "Reportes que se exportan:", ["Profit, costo de personal por empleado, gastos por categoría e ingresos recibidos y pendientes", "Solo profit global y por cuenta", "Todo lo anterior más horas por jobsite"], 0], ["Hito 7: Accounting", "formato", "Formato de exportación (por mes o rango de fechas):", ["CSV (abre en Excel), más PDF del dashboard para imprimir", "Excel .xlsx", "Solo PDF"], 0], ["Hito 7: notificaciones", "cuentas", "Para el push hacen falta una cuenta de Google con Firebase (Android) y la de Apple Developer (unos $99 al año, iPhone; también hace falta para publicar en el hito 8):", ["Las abro ahora y te paso el acceso", "Más adelante: por ahora solo correo y avisos dentro de la app"], 0], ["Hito 7: notificaciones", "canales", "Canales encendidos por defecto para cada persona:", ["Push y En la app; Email apagado", "Los tres encendidos", "Solo En la app"], 0], ["Hito 7: notificaciones", "remitente", "Correo de los avisos:", ["Desde mail.cidclean.com (el mismo del quote)", "Desde no-reply@auth.cidclean.com", "Un dominio nuevo para avisos"], 0], ["Hito 7: notificaciones", "resumen", "Inmediato o resumen:", ["Inmediato para eventos (quote visto/aceptado/rechazado, GPS fuera de rango, horario cambiado) y resumen diario a las 8:00 AM para lo acumulado", "Todo inmediato", "Todo en un resumen diario"], 0], ["Hito 7: notificaciones", "visita", "Aviso de visita próxima al empleado:", ["2 horas antes", "1 hora antes", "12 horas antes"], 0], ["Hito 7: notificaciones", "ingresosin", "Aviso de ingreso esperado sin marcar como recibido:", ["10 días después del día 1", "5 días después", "A fin de mes"], 0], ["Hito 7: notificaciones", "silencio", "Horas de silencio del push:", ["Sin push entre 9 PM y 7 AM (queda en la bandeja)", "Ninguna", "Cada persona elige su horario"], 0], ["Hito 7: notificaciones", "sinapp", "Staff sin acceso a la app:", ["No recibe avisos; le avisa el supervisor", "Recibe correo si tiene uno"], 0]];
const s=document.getElementById('s');let g='';
Q.forEach((q,k)=>{if(q[0]!==g){g=q[0];const h=document.createElement('h2');h.textContent=g;s.appendChild(h);}
const p=document.createElement('p');p.className='q';p.textContent=(k+1)+'. '+q[2];s.appendChild(p);
q[3].forEach((o,i)=>{const l=document.createElement('label');l.innerHTML='<input type="radio" name="'+q[1]+'" value="'+i+'"'+(i===q[4]?' checked':'')+'><span style="flex:1"></span>'+(i===q[4]?'<span class="r">Recomendado</span>':'');l.querySelector('span').textContent=o;s.appendChild(l);});});
document.getElementById('go').onclick=()=>{const ch=[];Q.forEach((q,k)=>{const v=+document.querySelector('input[name="'+q[1]+'"]:checked').value;if(v!==q[4])ch.push((k+1)+'. '+q[2]+' '+q[3][v]);});
const t=document.getElementById('t');t.value='Ronda 19: acepto todas las recomendaciones'+(ch.length?' salvo estas: '+ch.join(' | '):'.');t.hidden=false;document.getElementById('cp').hidden=false;t.select();};
document.getElementById('cp').onclick=()=>{const t=document.getElementById('t');t.select();try{document.execCommand('copy')}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(t.value).catch(()=>{});};
</script></body></html>
